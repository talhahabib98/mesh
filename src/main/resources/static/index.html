<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mesh</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <h1>Mesh</h1>
            <p class="subtitle">A distributed real-time chat</p>

            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <button type="submit">Log in</button>
            </form>

            <form id="register-form">
                <input type="text" id="register-username" placeholder="Username" required />
                <input type="email" id="register-email" placeholder="Email" required />
                <input type="password" id="register-password" placeholder="Password" required />
                <button type="submit">Create account</button>
            </form>

            <p id="auth-error" class="error"></p>
        </div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <strong id="current-username"></strong>
                <button id="logout-button" title="Log out">⏻</button>
            </div>

            <form id="create-room-form">
                <input type="text" id="new-room-name" placeholder="New room name" required />
                <button type="submit">+</button>
            </form>

            <ul id="room-list"></ul>

            <div class="presence">
                <h4>Online in this room</h4>
                <ul id="presence-list"></ul>
            </div>
        </aside>

        <main class="chat-pane">
            <header id="room-header">Select a room to start chatting</header>
            <div id="messages" class="messages"></div>
            <form id="send-form" class="send-form hidden">
                <input type="text" id="message-input" placeholder="Message..." autocomplete="off" />
                <button type="submit">Send</button>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
