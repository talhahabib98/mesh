spring:
  application:
    name: mesh

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mesh}
    username: ${DB_USER:mesh}
    password: ${DB_PASSWORD:mesh}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

mesh:
  node:
    id: ${NODE_ID:node-local}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-change-this-dev-only-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  redis:
    chat-channel: mesh:chat:broadcast

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mesh: INFO
